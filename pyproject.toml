[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langai-platform"
version = "0.1.0"
description = "Private, traceable dictionary representation training"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "alembic>=1.14,<2", "python-multipart>=0.0.20", "boto3>=1.36,<2", "redis>=5,<7",
  "rq>=2.1,<3", "openpyxl>=3.1,<4", "numpy>=1.26,<3", "scikit-learn>=1.6,<2",
  "httpx>=0.28,<1", "typer>=0.15,<1", "safetensors>=0.5,<1", "filelock>=3.16,<5",
]
[project.optional-dependencies]
ml = ["torch>=2.6,<3", "sentence-transformers>=5,<6", "transformers>=4.51,<5", "datasets>=3,<5", "peft>=0.15,<1", "accelerate>=1.3,<2"]
dev = ["pytest>=8,<9", "ruff>=0.11", "pytest-cov>=6", "build>=1"]
[project.scripts]
langai = "cli.main:app"
[tool.setuptools.packages.find]
include = ["apps*", "ml*", "cli*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL, Redis and S3", "ml: local PyTorch smoke training"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Small CPU experiments should not install the Linux CUDA runtime by default.
# GPU deployments can explicitly override this source in their own worker image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
